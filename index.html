<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitHub Actions × AWS 데모</title>
<style>
  :root {
    --text-dark: #14171f;
    --text-muted: #5b6472;
    --accent: #3e7bfa;
    --accent-2: #f2a93b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 20% 20%, #1b2540 0%, #0f1117 55%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    padding: 24px;
  }
  .card {
    background: #ffffff;
    border-radius: 24px;
    padding: 56px 48px;
    max-width: 560px;
    width: 100%;
    box-shadow: 0 30px 80px rgba(0,0,0,0.35);
    text-align: center;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #eef4ff;
    color: var(--accent);
    font-size: 14px;
    font-weight: 600;
    padding: 8px 16px;
    border-radius: 999px;
    margin-bottom: 24px;
  }
  .badge .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #2e9e4e;
  }
  h1 {
    font-size: 32px;
    margin: 0 0 12px;
    color: var(--text-dark);
    line-height: 1.3;
  }
  p.subtitle {
    color: var(--text-muted);
    font-size: 16px;
    line-height: 1.6;
    margin: 0 0 32px;
  }
  .version {
    display: inline-block;
    background: #14171f;
    color: #ffffff;
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
    font-size: 15px;
    padding: 12px 20px;
    border-radius: 12px;
    letter-spacing: 0.5px;
  }
  .version b {
    color: var(--accent-2);
  }
  footer {
    margin-top: 32px;
    font-size: 13px;
    color: #9aa3b2;
  }
</style>
</head>
<body>
  <div class="card">
    <span class="badge"><span class="dot"></span>Deployed via GitHub Actions</span>
    <h1>안녕하세요</h1>
    <p class="subtitle">
      이 페이지는 GitHub Actions가 자동으로 S3 + CloudFront에 배포한 페이지입니다.<br>
      아래 문구를 코드에서 바꾸고 push하면, 이 화면도 자동으로 바뀝니다.
    </p>
    <div class="version">현재 버전: <b>v1</b></div>
    <footer>GitHub Actions × AWS 자동 배포 데모</footer>
  </div>
</body>
</html>
